; ==========================================================
; DISCORD S3 PRO - BACKEND CONFIGURATION
; ==========================================================

[Server]
; Port on which the Express API will listen
port = 3000

; Maximum size of each encrypted chunk in bytes.
; Standard: 7864320 (7.5 MB) - Recommended to stay under 8MB for Discord stability.
chunk_size = 7864320

; Maximum file size allowed for upload in bytes.
; Default: 524288000 (500 MB)
; Set to 0 to disable file size limit (not recommended)
max_file_size = 524288000

[Database]
; MongoDB Connection URI (Required)
; In Docker, 'db' refers to the container name defined in docker-compose.
mongo_uri = mongodb://localhost:27017/discord-s3

; Maximum number of connections in the pool (default: 5)
pool_max = 10

; Minimum number of connections kept warm
pool_min = 2

; Timeout in ms to establish a connection at startup
connect_timeout_ms = 5000

; Timeout in ms for idle socket operations
socket_timeout_ms = 30000

; Timeout in ms to find a primary server
server_selection_timeout_ms = 5000

[Queue]
; Number of concurrent Discord upload workers (should match channel count)
upload_concurrency = 3

; Number of concurrent Discord download workers (sliding window to control memory usage)
; Lower = less RAM, higher = faster. Recommended: same as upload_concurrency.
download_concurrency = 3

[Discord]
; List of Discord Channel IDs where chunks will be stored.
; Separate IDs with a comma (e.g., ID1,ID2,ID3)
storage_channels = 1486405223189712997,1486405253183049899,1486405274645565553